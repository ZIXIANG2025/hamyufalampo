spring.application.name=SafeDocsApplication
server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
safedocs.ai.enabled=${SAFEDOCS_AI_ENABLED:false}
safedocs.ai.provider=${SAFEDOCS_AI_PROVIDER:openai}
safedocs.ai.openai.api-key=${OPENAI_API_KEY:}
safedocs.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
safedocs.ai.gemini.api-key=${GEMINI_API_KEY:}
safedocs.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
safedocs.ai.openai.base-url=https://api.openai.com/v1
safedocs.ai.custom.base-url=${SAFEDOCS_AI_CUSTOM_BASE_URL:}
safedocs.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
safedocs.ai.max-characters=100000
safedocs.ai.chunk-characters=7000
safedocs.ai.chunk-overlap=400
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-swallow-size=21MB
